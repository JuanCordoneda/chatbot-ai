services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crowi
      POSTGRES_PASSWORD: crowi
      POSTGRES_DB: crowi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowi"]
      interval: 5s
      timeout: 5s
      retries: 5

  whatsapp-service:
    build: ./whatsappService
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - openai-service

  openai-service:
    build:
      context: .
      dockerfile: openAIService/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./admin-key.json:/app/admin-key.json:ro
      - ./openAIService/langchainService.py:/app/langchainService.py
      - ./openAIService/modules:/app/modules
      - ./openAIService/prompts:/app/prompts
      - ./openAIService/clients_map.json:/app/clients_map.json
      - ./common:/app/common
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./alembic.ini:/app/alembic.ini
      - whisper-cache:/root/.cache/huggingface

  web-service:
    build:
      context: .
      dockerfile: webService/Dockerfile
    ports:
      - "8502:8502"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      openai-service:
        condition: service_started
    volumes:
      # Directorio completo, NO archivo por archivo: en macOS el bind-mount de un
      # archivo suelto queda apuntando al inode viejo cuando el editor lo
      # reescribe, y el contenedor llega a servir una copia parcial (SyntaxError
      # a mitad del archivo) o directamente el código anterior. Con el directorio
      # montado, los cambios se ven siempre.
      - ./webService:/app
      - ./common:/app/common

volumes:
  whisper-cache:
  pgdata:
