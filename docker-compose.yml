version: "3.8"

services:
  whatsapp-service:
    build: ./whatsappService
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - openai-service

  openai-service:
    build: ./openAIService
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./admin-key.json:/app/admin-key.json:ro
      - ./openAIService/session-crowagency.ofc:/app/session-crowagency.ofc:ro

  web-service:
    build: ./webService
    ports:
      - "8502:8502"
    env_file:
      - .env
    depends_on:
      - openai-service
