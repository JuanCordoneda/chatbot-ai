services:
  whatsapp-service:
    build: ./whatsappService
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_SERVICE_URL=http://openai-service:8000
    depends_on:
      - openai-service

  openai-service:
    build: ./openAIService
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - WHATSAPP_SERVICE_URL=http://whatsapp-service:8501
      - DB_PATH=/data/prospector.db
    volumes:
      - ./data:/data
