<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Instrument+Serif:ital@1&family=DM+Sans:wght@700&display=block">
<style>
:root{--ink:#16110e;--white:#fffaf3;--rosa-soft:#f4b9cb;--marigold:#f3a530;--chile:#cf3a2c}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--ink)}
.card{position:relative;width:1200px;height:630px;color:var(--white);display:grid;place-items:center;text-align:center}
.card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
.card::before{content:"";position:absolute;inset:0;z-index:1;background:
  radial-gradient(ellipse 52% 72% at 50% 50%,rgba(22,17,14,.9) 0%,rgba(22,17,14,.74) 50%,rgba(22,17,14,.3) 100%),
  linear-gradient(180deg,rgba(22,17,14,.35) 0%,rgba(22,17,14,0) 30%,rgba(22,17,14,0) 70%,rgba(22,17,14,.55) 100%)}
.card::after{content:"";position:absolute;z-index:2;inset:18px;border:2px solid rgba(243,165,48,.55);border-radius:22px}
.c{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center}
.eyebrow{font:700 22px/1 "DM Sans",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--rosa-soft)}
h1{font:900 250px/.8 "Big Shoulders Display",Impact,sans-serif;margin-top:22px;text-shadow:0 6px 30px rgba(0,0,0,.45)}
.tag{font:italic 70px/1 "Instrument Serif",Georgia,serif;color:var(--marigold);margin-top:6px}
.pill{margin-top:28px;display:inline-flex;align-items:center;gap:12px;padding:13px 26px;border-radius:999px;background:var(--chile);font:700 21px/1 "DM Sans",sans-serif;letter-spacing:.04em;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.until{margin-top:20px;font:700 20px/1 "DM Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--rosa-soft)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--white);opacity:.7}
</style></head><body><div class="card"><img src="file:///Users/abc/Desktop/CROW/PARIS/Toloache/toloache/fuente/assets/tacos.jpg" alt="">
<div class="c"><div class="eyebrow">Toloache · Montmartre</div>
<h1>−10 %</h1><p class="tag">le midi, du mardi au vendredi</p>
<div class="pill">12h – 15h <i></i> 49 rue de Clignancourt <i></i> M° Château Rouge</div>
<p class="until">Jusqu'au 18 décembre</p></div></div></body></html>
