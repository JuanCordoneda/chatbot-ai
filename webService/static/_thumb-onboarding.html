<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<!-- Miniatura de la sección de ayuda (la que se ve al pegar el link en WhatsApp,
     Slack, etc.). Mismo molde que _thumb.html, para que las dos previews se
     vean de la misma familia. Se renderiza a og-onboarding.png:

     chrome --headless=new --screenshot=og-onboarding.png --window-size=1200,630 _thumb-onboarding.html
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#0b0b0c; font-family:Inter,-apple-system,sans-serif;
         display:flex; align-items:center; overflow:hidden; position:relative; }
  .glow { position:absolute; width:900px; height:900px; border-radius:50%;
          background:radial-gradient(circle, rgba(245,168,0,.22) 0%, rgba(245,168,0,0) 62%);
          left:-230px; top:-140px; }
  .glow2 { position:absolute; width:700px; height:700px; border-radius:50%;
           background:radial-gradient(circle, rgba(245,168,0,.10) 0%, rgba(245,168,0,0) 65%);
           right:-180px; bottom:-220px; }
  .grid { position:absolute; inset:0;
          background-image:linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
                           linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
          background-size:48px 48px;
          -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 35%, transparent 78%); }
  .wrap { position:relative; display:flex; align-items:center; gap:56px; padding:0 74px; width:100%; }
  .left { flex:0 0 auto; display:flex; flex-direction:column; gap:22px; align-items:flex-start; }
  .left img { width:430px; display:block; mix-blend-mode:lighten; }
  .badge { display:inline-flex; align-items:center; gap:9px; padding:9px 18px; border-radius:999px;
           background:rgba(245,168,0,.10); border:1px solid rgba(245,168,0,.32);
           color:#F5A800; font-size:19px; font-weight:600; letter-spacing:.2px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#F5A800; box-shadow:0 0 12px #F5A800; }
  .divider { width:2px; height:300px; flex:0 0 auto;
             background:linear-gradient(180deg, transparent, rgba(245,168,0,.75) 22%, rgba(245,168,0,.75) 78%, transparent); }
  .right h1 { font-size:78px; line-height:1.02; font-weight:800; color:#F5A800; letter-spacing:-2.4px; }
  .right p { margin-top:20px; font-size:26px; color:#8d8d95; white-space:nowrap; font-weight:500; letter-spacing:-.2px; }
  /* Las dos guías, numeradas igual que en la pantalla. */
  .guias { margin-top:34px; display:flex; flex-direction:column; gap:12px; }
  .guia { display:flex; align-items:center; gap:13px; padding:11px 18px 11px 12px; border-radius:13px;
          background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.09);
          color:#e9e9ee; font-size:21px; font-weight:600; }
  .n { width:30px; height:30px; flex:0 0 auto; border-radius:50%; background:#F5A800; color:#0b0b0c;
       font-size:17px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .guia em { font-style:normal; color:#8d8d95; font-weight:500; font-size:19px; }
</style>
</head>
<body>
  <div class="glow"></div><div class="glow2"></div><div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <img src="growi.png" alt="GROWI" />
      <div class="badge"><span class="dot"></span> Guía paso a paso</div>
    </div>
    <div class="divider"></div>
    <div class="right">
      <h1>Onboarding</h1>
      <p>Todo lo que hay que saber, con capturas</p>
      <div class="guias">
        <div class="guia"><span class="n">1</span> Cargar un cliente <em>· 8 pasos</em></div>
        <div class="guia"><span class="n">2</span> Crear una orden <em>· 6 pasos</em></div>
      </div>
    </div>
  </div>
</body>
</html>
